[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowpad"
dynamic = ["version"]
description = "A local-first AI development environment powered by Claude Code"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Langware Labs", email = "eran@langware.ai"},
]
dependencies = [
    "platformdirs",
    "requests",
    "fastapi",
    "uvicorn[standard]",
    "httpx[http2]",
    "dpath~=2.2.0",
    "typer>=0.9.0",
    # Installed transitively by typer, but `flow instance ctl` imports it
    # directly to render instance/group tables — declare what we import.
    "rich",
    # Terminal QR for `flow connect` device-code enrollment (pure python).
    "segno>=1.6",
    "python-dotenv",
    "keyring",
    "keyrings.alt",
    # FastMCP 4 uses MCP 2.x; pydantic-ai 1.x's MCP integration requires MCP 1.x.
    "fastmcp>=3,<4",
    "httpx>=0.24.0,<1.0",
    "websockets",
    "sqlalchemy~=2.0.27",
    "aiosqlite",
    "aiohttp",
    "greenlet",
    "pydantic>=2.0.0",
    "psutil",
    "filelock",
    "ptyprocess; sys_platform != 'win32'",
    "pywinpty; sys_platform == 'win32'",
    "nest-asyncio>=1.6.0",
    "pybars3~=0.9.7",
    "aiofiles",
    "beautifulsoup4",
    "dpath",
    "tiktoken",
    # <2.24: usearch 2.24+ depends on numkong, which ships no wheels for many
    # platforms and fails to build from source (needs omp.h) — breaks fresh installs.
    "usearch<2.24",
    "numpy",
    "bs4>=0.0.2",
    "h2",
    "groq",
    "openai",
    "anthropic",
    "pydantic-ai-slim[mcp]>=1.62,<2",
    "distro",
    "appdirs",
    "colorama",
    "apscheduler~=3.10",
    "pathspec",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://flowpad.ai"
Repository = "https://github.com/langware-labs/flowpad"

[project.scripts]
flow = "flow_sdk.cli:cli_main"
flow-sdk-mcp = "flow_sdk.mcp_server:run"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio==0.24.0",
    "build",
    "twine",
    "ruff>=0.15.2",
    "pytest-timeout>=2.4.0",
    "pytest-env>=1.2.0",
    "pytest-rerunfailures>=16.0",
    "memray>=1.19.2; sys_platform != 'win32'",
    "pre-commit>=4.0.0",
]

[tool.setuptools.dynamic]
version = {attr = "flow_sdk._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["flow_sdk*"]

[tool.setuptools.package-data]
"flow_sdk" = [
    "system_projects/**/*",
    "system_projects/**/.claude/**/*",
    "server/static/**/*",
    # Builtin asset editors (SDK apps declared through TypeMetadata.editors).
    "assets/editors/**/*",
    # Type icons addressed by path from TypeInfo.icon — see server/icons/README.
    "server/icons/**/*",
    # Separately-signed standalone flow-rs binaries (macOS universal2 +
    # Windows x64), vendored by scripts/deploy_to_github.sh. NOT the crate
    # source or target/ — only the signed binaries under rust/bin/.
    "rust/bin/**/*",
]

# Keep skill UI source + the built main.html, but never ship node_modules,
# the intermediate vite dist/, or build/test caches. Without these excludes
# the wheel inflates by hundreds of MB per skill that has a ui/ project.
[tool.setuptools.exclude-package-data]
"flow_sdk" = [
    "system_projects/**/node_modules/**",
    "system_projects/**/ui/dist/**",
    "system_projects/**/package-lock.json",
    "system_projects/**/.vite/**",
    # Run journals are per-user EXECUTION OUTPUT written next to the authored
    # flow/journey. They must never ship in the wheel.
    "system_projects/**/runs/**",
]

[tool.ruff]
line-length = 120
extend-exclude = [
    "**/claude_skills/**",
    "**/claude_test_skills/**",
    "**/.claude/skills/**",
]

[tool.ruff.lint]
extend-select = [
    "I",      # Import sorting
    "F401",   # Unused import
    "T20",    # Ban print statements
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]
"flow_cli/**/*.py" = ["T20"]
"flow_sdk/models/entities.py" = ["T20"]
"flow_sdk/server/run.py" = ["T20", "E402"]
"flow_sdk/server/app.py" = ["T20", "E402"]
"examples/*" = ["T20"]
"flow_sdk/db/drivers/sqlite/sqlite_driver.py" = ["E402"]
# Registers its sub-typers at the BOTTOM of the file, each import immediately
# above its own `app.add_typer` so the two cannot drift apart. Same shape, and
# same exemption, as run.py and app.py above.
"flow_sdk/cli/flow_cli.py" = ["E402"]
"flow_sdk/fs_store/schema_registry.py" = ["F821"]

[tool.pyright]
typeCheckingMode = "basic"
reportUnknownMemberType = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pytest_env]
SQLITE_DATABASE_PATH = "/tmp/flowpad_test.db"
TESTING = "true"

[tool.uv]
prerelease = "allow"
