<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Flowpad - Starting...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: hsl(0 0% 3.9%);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: hsl(0 0% 98%);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      text-align: center;
      padding: 40px;
      transition: transform 0.3s ease-out;
    }

    body.logs-open .container {
      transform: translateY(-20vh);
    }

    .logo {
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
      animation: subtle-pulse 4s ease-in-out infinite;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 300;
      color: hsl(0 0% 98%);
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 1rem;
      color: hsl(0 0% 63.9%);
      margin-bottom: 40px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 2px solid hsl(0 0% 14.9%);
      border-top-color: hsl(0 0% 98%);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    .status {
      font-size: 0.875rem;
      color: hsl(0 0% 63.9%);
    }

    .show-logs-btn {
      position: fixed;
      bottom: 16px;
      left: 16px;
      padding: 6px 16px;
      font-size: 0.75rem;
      color: hsl(0 0% 63.9%);
      background: transparent;
      border: 1px solid hsl(0 0% 14.9%);
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
      z-index: 10;
    }

    .show-logs-btn:hover {
      color: hsl(0 0% 98%);
      border-color: hsl(0 0% 30%);
    }

    .logs-panel {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-height: 40vh;
      background: hsl(0 0% 5.5%);
      border-top: 1px solid hsl(0 0% 14.9%);
      overflow: hidden;
      animation: slide-up 0.3s ease-out;
    }

    .logs-panel.visible {
      display: flex;
      flex-direction: column;
    }

    .logs-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      border-bottom: 1px solid hsl(0 0% 14.9%);
      flex-shrink: 0;
    }

    .logs-tabs {
      display: flex;
      gap: 4px;
    }

    .logs-tab {
      padding: 4px 12px;
      font-size: 0.75rem;
      color: hsl(0 0% 63.9%);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 0.375rem;
      cursor: pointer;
    }

    .logs-tab.active {
      color: hsl(0 0% 98%);
      background: hsl(0 0% 14.9%);
    }

    .logs-close {
      padding: 4px 8px;
      font-size: 0.875rem;
      color: hsl(0 0% 63.9%);
      background: transparent;
      border: none;
      cursor: pointer;
      border-radius: 0.375rem;
    }

    .logs-close:hover {
      color: hsl(0 0% 98%);
      background: hsl(0 0% 14.9%);
    }

    .logs-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      font-family: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
      font-size: 0.7rem;
      line-height: 1.5;
      color: hsl(0 0% 63.9%);
      white-space: pre-wrap;
      word-break: break-all;
    }

    @keyframes slide-up {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes subtle-pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.8;
        transform: scale(0.98);
      }
    }

    .dots {
      display: inline-block;
      width: 1.5em;
      text-align: left;
    }

    .dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="loading-logo.png" alt="Flowpad" width="120" height="120">
    </div>
    <h1>Flowpad</h1>
    <p class="subtitle">Local Flow Server</p>
    <div class="spinner"></div>
    <p class="status" id="status-text">Starting server<span class="dots"></span></p>
  </div>
  <button class="show-logs-btn" id="show-logs-btn">Show Logs</button>

  <div class="logs-panel" id="logs-panel">
    <div class="logs-header">
      <div class="logs-tabs" id="logs-tabs"></div>
      <button class="logs-close" id="logs-close">&times;</button>
    </div>
    <pre class="logs-content" id="logs-content"></pre>
  </div>

  <script src="loading-renderer.js"></script>
</body>
</html>
