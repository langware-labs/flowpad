name: No retired history

# Fails a push or PR whose history contains a retired commit (a branch cut from a clone that
# predates the history clean-up). Runs in parallel with the test jobs and takes seconds.
# The list holds one-way fingerprints only; see scripts/check_no_old_history.py.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 scripts/check_no_old_history.py
