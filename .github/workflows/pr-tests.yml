name: PR Tests

# Runs the fast, backend-free backend (pytest) test tier on every pull request.
#
# NON-BLOCKING BY DESIGN: this job must NOT be added to the branch-protection
# "required status checks" list — a PR can merge while it is red or pending.
# It still reports true pass/fail, because the PyPI deploy gate
# (docs/pypi-deploy.md → "Test gate") reads this status to decide whether to
# publish. Making it required here, or forcing it green, would break that gate.
#
# Scope: only the pytest `tests/unit` tier runs here. It is fully backend-free
# (no live server, no PTY) and deterministic on Linux. Intentionally EXCLUDED:
#   - vitest (frontend) — those tiers need source changes / a live backend to
#     pass on CI, so they are not run here.
#   - pytest tests/cli — spawns servers/PTYs and segfaults at interpreter
#     shutdown on Linux (exit 139), so it is not run here.
#   - all deep_testing tiers (tests/long_tests, tests/migration_e2e,
#     tests/pty_fuzz, tests/hub_tests).

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python 3.10
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run pytest (unit)
        run: uv run pytest tests/unit -q
