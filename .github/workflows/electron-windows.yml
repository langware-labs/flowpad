name: Electron (Windows)

# The desktop wrapper's unit tests on a real Windows runner — only when something under electron/ changes.
#
# Why: the wrapper's updater, installer and backend-stop code is Windows-specific in the places that hurt
# (taskkill instead of signals, NSIS, `uv tool install` into AppData, no fcntl). tests.yml runs the same
# tests on Linux only, which cannot see those differences. Plain node scripts: no Electron binary is needed,
# so `--ignore-scripts`. Needs NO repository secrets.
#
# NON-BLOCKING, like tests.yml: do not add it to the branch-protection required checks. Keep the name stable —
# the deploy gate reads PR check conclusions.
#
# Each test file runs on its own (`npm test` stops at the first failure and hides the rest). A file listed in
# KNOWN_FAILURES is reported as a warning, not a failure: it fails on Windows today for a reason unrelated to
# the change under test. Remove the entry when the test is fixed — never add one to get a run green.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'electron/**'
      - '.github/workflows/electron-windows.yml'
  push:
    branches:
      - main
      - 'release/v*'
    paths:
      - 'electron/**'
      - '.github/workflows/electron-windows.yml'
  workflow_dispatch:

jobs:
  electron-windows:
    name: electron (node unit tests, Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: electron
      - name: node unit tests, one file at a time
        working-directory: electron
        env:
          # uv-manager.test.js fakes a child whose kill('SIGTERM') the code never calls on win32 (it uses
          # `taskkill /T /F` there), so its "stalled install is stopped" assertions see no signal.
          KNOWN_FAILURES: 'uv-manager.test.js'
        run: |
          failed=()
          warned=()
          # npm test's own list is the source of truth for which files are tests
          for f in $(node -e "console.log(require('./package.json').scripts.test.split('&&').map(s=>s.trim().replace(/^node\s+/,'')).join(' '))"); do
            echo "::group::$f"
            if node "$f"; then
              echo "PASS $f"
            elif [[ " $KNOWN_FAILURES " == *" $f "* ]]; then
              echo "::warning file=electron/$f::fails on Windows (known): see KNOWN_FAILURES in this workflow"
              warned+=("$f")
            else
              echo "FAIL $f"
              failed+=("$f")
            fi
            echo "::endgroup::"
          done
          echo "known failures (warned): ${warned[*]:-none}"
          echo "failed: ${failed[*]:-none}"
          [ ${#failed[@]} -eq 0 ]
