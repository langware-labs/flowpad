name: UI Type Check

# Type-checks the frontend with `tsc --noEmit` on every PR that touches ui/**.
#
# Why this exists: nothing else in CI type-checks the frontend. `vite build`
# and vitest both transform TS with esbuild, which STRIPS types without
# checking them, so scope/type errors (e.g. a component using the Lingui `t`
# macro with no `useLingui()` binding -> runtime "t is not defined") sail
# through every other gate and only crash at runtime. `tsc --noEmit` is the
# pure validity pass that catches them before merge.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'ui/**'

concurrency:
  group: ui-typecheck-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  type-check:
    name: ui type-check (tsc --noEmit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run type-check
