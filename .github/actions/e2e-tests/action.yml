name: 'Live-backend E2E (vitest headless + api, Playwright)'
description: 'Boot flow_sdk server, satisfy the headless instance contract, run live tiers'
inputs:
  only:
    description: >-
      Run one tier instead of all of them: vitest, first-run-setup, dependencies or
      navigation. Empty runs everything. For iterating on one failure — the PR run is
      always the full set.
    required: false
    default: ''
  grep:
    description: 'Playwright --grep for the selected scenario (a test title substring or regex).'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Set up uv + Python 3.11
      uses: astral-sh/setup-uv@v10.0.1
      with:
        python-version: '3.11'
        enable-cache: true

    # Same rationale as backend-tests: keep traceback-shaped WARNING lines in
    # the backend log from becoming error annotations on green runs.
    - name: Disable Python problem matcher (annotates warnings as errors)
      run: echo "::remove-matcher owner=python::"
      shell: bash

    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json

    - name: Install backend dependencies
      run: uv sync --dev --frozen
      shell: bash

    - name: Install frontend dependencies
      run: npm ci
      shell: bash
      working-directory: ui

    # The live-backend vitest tiers spawn real claude workers (createProcess
    # refuses with "Claude CLI is not installed" otherwise) — same install the
    # backend-api job does.
    - name: Install Claude Code
      run: npm install -g @anthropic-ai/claude-code
      shell: bash

    # ---- Instance contract (see ui/tests/headless/_backend.ts) ----
    # The headless tier requires FLOW_INSTANCE, .env.<name>.local at the repo
    # root, and $FLOW_HOME/instances/<name>/launcher.json with the LIVE
    # backend pid. instance_ctl.sh would set these up but needs a hub, so CI
    # fabricates them and boots the server directly (it runs standalone).
    # SOD_ENC_KEY (Fernet) keeps every secrets path off the runner's absent
    # OS keyring. FLOWPAD_CLAUDE_HOME points the server's worker-history and
    # the react tier's session fixtures at one scratch transcript root
    # (tests/react/chats-open-recency.test.ts requires it to be set).
    - name: Configure CI instance env
      run: |
        {
          echo "FLOW_INSTANCE=ci-e2e"
          echo "FLOW_HOME=$RUNNER_TEMP/flow-home"
          echo "LOCAL_SERVER_PORT=6099"
          echo "VITE_PORT=5099"
          echo "SQLITE_DATABASE_PATH=$RUNNER_TEMP/flowpad_ci_e2e.db"
          echo "FLOWPAD_CLAUDE_HOME=$RUNNER_TEMP/claude-home"
          echo "CLAUDE_CONFIG_DIR=$RUNNER_TEMP/claude-home"
          echo "SOD_ENC_KEY=$(uv run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
        } >> "$GITHUB_ENV"
      shell: bash

    # The API-tier PTY regression exercises AgenticProcess save -> open ->
    # attach, not provider authentication. The scratch Claude config above is
    # deliberately signed out, so give the resolver an explicit, inert source.
    # The test opens an idle composer (no prompt), therefore this key is never
    # sent to OpenRouter.
    - name: Seed LLM source for PTY contract test
      run: .venv/bin/python -c 'from flow_sdk.cli.auth.lm_api_keys import set_lm_api; set_lm_api("ci-e2e-inert-key", "openrouter")'
      shell: bash

    - name: Write .env.ci-e2e.local (headless tier reads it via loadEnv)
      run: |
        cat > .env.ci-e2e.local <<EOF
        FLOW_INSTANCE=ci-e2e
        LOCAL_SERVER_PORT=6099
        VITE_PORT=5099
        VITE_API_URL=http://localhost:6099
        EOF
      shell: bash

    - name: Start backend
      env:
        MINIHUB_RELOAD: 'False'          # single process → stable PID
        FLOWPAD_SKIP_DOTENV: 'true'      # env above is authoritative
        FLOWPAD_SKIP_LOCK: 'true'        # isolated test server
        # A fresh backend fires first-run setup on the first tab, which steers it to
        # the wizard page. Only the first-run-setup scenario below wants that.
        FLOWPAD_SKIP_FIRST_RUN_SETUP: 'true'
      run: |
        # .venv/bin/python (not `uv run`) so $! IS the server PID —
        # launcher.json's backend_pid liveness check kill-0s this exact pid.
        nohup .venv/bin/python -m flow_sdk.server.run &> backend.log &
        echo "BACKEND_PID=$!" >> "$GITHUB_ENV"
      shell: bash

    - name: Write launcher.json (headless instance identity check)
      run: |
        mkdir -p "$FLOW_HOME/instances/ci-e2e"
        cat > "$FLOW_HOME/instances/ci-e2e/launcher.json" <<EOF
        {
          "name": "ci-e2e",
          "backend_port": 6099,
          "env_file": "$GITHUB_WORKSPACE/.env.ci-e2e.local",
          "backend_pid": $BACKEND_PID
        }
        EOF
      shell: bash

    - name: Wait for backend readiness (bootstrap)
      run: |
        timeout=60   # seconds — do not raise; a slower boot is a bug to fix
        elapsed=0
        # Same predicate the headless tier enforces: HTTP 200 AND "types" present.
        until curl -fsS http://localhost:6099/api/v1/graph/bootstrap | grep -q '"types"'; do
          if [ "$elapsed" -ge "$timeout" ]; then
            echo "Backend did not become ready within ${timeout}s."
            tail -50 backend.log || true
            exit 1
          fi
          sleep 1
          elapsed=$((elapsed+1))
        done
        echo "Backend ready."
      shell: bash

    - name: vitest headless (in-process E2E, live backend)
      if: ${{ inputs.only == '' || inputs.only == 'vitest' }}
      run: npm run test:vitest:headless
      shell: bash
      working-directory: ui

    - name: vitest api (live backend)
      if: ${{ inputs.only == '' || inputs.only == 'vitest' }}
      run: npm run test:vitest:api
      shell: bash
      working-directory: ui

    # jsdom but live-SDK (entity writes, host-file actions): requires the same
    # launcher-owned instance contract as headless (tests/react/_instance.ts).
    - name: vitest react (live backend)
      if: ${{ inputs.only == '' || inputs.only == 'vitest' }}
      run: npm run test:vitest:react
      shell: bash
      working-directory: ui

    # ---- Playwright scenario: dependencies (flow.json; self-seeding, single spec) ----
    # The vitest tiers above leave real entities behind (projects, tabs); that
    # restored last-active state keeps ProjectHome from rendering for the URL
    # the spec navigates to. Mirror the reference CI's between-suite DB
    # cleanup: restart the backend on a fresh database.
    - name: Reset backend state before Playwright
      if: ${{ inputs.only == '' || inputs.only == 'first-run-setup' || inputs.only == 'dependencies' }}
      env:
        MINIHUB_RELOAD: 'False'
        FLOWPAD_SKIP_DOTENV: 'true'
        FLOWPAD_SKIP_LOCK: 'true'
        # No FLOWPAD_SKIP_FIRST_RUN_SETUP: the first Playwright scenario IS first-run
        # setup, so this backend must be a fresh install whose trigger may fire.
      run: scripts/ci_e2e_reset_backend.sh
      shell: bash

    - name: Start vite dev server
      if: ${{ inputs.only == '' || inputs.only == 'first-run-setup' || inputs.only == 'dependencies' }}
      run: |
        # --mode ci-e2e → vite loadEnv picks .env.ci-e2e.local (VITE_API_URL :6099)
        nohup npm run dev -- --mode ci-e2e --port 5099 &> ../vite.log &
        echo "VITE_PID=$!" >> "$GITHUB_ENV"
      shell: bash
      working-directory: ui

    - name: Wait for vite dev server
      if: ${{ inputs.only == '' || inputs.only == 'first-run-setup' || inputs.only == 'dependencies' }}
      run: |
        timeout=60
        elapsed=0
        until curl -fsS http://localhost:5099 > /dev/null 2>&1; do
          if [ "$elapsed" -ge "$timeout" ]; then
            echo "Vite dev server did not start within ${timeout}s."
            tail -50 vite.log || true
            exit 1
          fi
          sleep 1
          elapsed=$((elapsed+1))
        done
        echo "Vite dev server ready."
      shell: bash

    - name: Install Playwright browsers
      if: ${{ inputs.only == '' || inputs.only == 'first-run-setup' || inputs.only == 'dependencies' || inputs.only == 'navigation' }}
      run: npx playwright install --with-deps chromium
      shell: bash
      working-directory: ui

    # ---- Playwright scenario: first-run setup (needs the fresh backend above) ----
    - name: Playwright — first-run setup scenario
      if: ${{ inputs.only == '' || inputs.only == 'first-run-setup' }}
      env:
        SETUP_FE_PORT: '5099'
      run: npx playwright test --config tests/e2e/first-run-setup/playwright.config.ts --max-failures=1 ${{ inputs.grep && format('--grep "{0}"', inputs.grep) || '' }}
      shell: bash
      working-directory: ui

    # First-run setup has now fired and left its wizard page as the last-active
    # view; dependencies needs a fresh database again, with setup switched off.
    - name: Reset backend state before dependencies
      if: ${{ inputs.only == '' || inputs.only == 'dependencies' }}
      env:
        MINIHUB_RELOAD: 'False'
        FLOWPAD_SKIP_DOTENV: 'true'
        FLOWPAD_SKIP_LOCK: 'true'
        FLOWPAD_SKIP_FIRST_RUN_SETUP: 'true'
      run: scripts/ci_e2e_reset_backend.sh
      shell: bash

    - name: Playwright — project dependencies (flow.json) scenario
      if: ${{ inputs.only == '' || inputs.only == 'dependencies' }}
      env:
        DEP_FE_PORT: '5099'
        DEP_BE_PORT: '6099'
      run: npx playwright test --config tests/e2e/dependencies/playwright.config.ts --max-failures=1 ${{ inputs.grep && format('--grep "{0}"', inputs.grep) || '' }}
      shell: bash
      working-directory: ui

    # ---- Navigation + speed: docs/navigation/dock-loading.md in a browser ----
    # A real agentic-process terminal needs a worker; the MOCK worker is a
    # scripted `claude` on PATH (tests/fixtures/mock_worker_bin) — no LLM, no
    # keys. Capability discovery reads a login shell's PATH, so SHELL is the
    # probe-aware wrapper that answers that probe with the PATH given here.
    - name: Restart backend with the mock worker (fresh DB)
      if: ${{ inputs.only == '' || inputs.only == 'navigation' }}
      env:
        MINIHUB_RELOAD: 'False'
        FLOWPAD_SKIP_DOTENV: 'true'
        FLOWPAD_SKIP_LOCK: 'true'
        # A fresh DB fires first-run setup on the first tab: it steers that tab to
        # the wizard page and runs tool checks while the speed budgets are measured.
        FLOWPAD_SKIP_FIRST_RUN_SETUP: 'true'
      run: |
        kill "$BACKEND_PID" 2>/dev/null || true
        for i in $(seq 1 30); do kill -0 "$BACKEND_PID" 2>/dev/null || break; sleep 1; done
        rm -f "$SQLITE_DATABASE_PATH"
        rm -rf "$FLOW_HOME/instances/ci-e2e"
        mkdir -p "$FLOW_HOME/instances/ci-e2e"
        PATH="$GITHUB_WORKSPACE/tests/fixtures/mock_worker_bin:$PATH" \
        SHELL="$GITHUB_WORKSPACE/tests/fixtures/mock_worker_shell" \
          nohup .venv/bin/python -m flow_sdk.server.run >> backend.log 2>&1 &
        NEW_PID=$!
        echo "BACKEND_PID=$NEW_PID" >> "$GITHUB_ENV"
        cat > "$FLOW_HOME/instances/ci-e2e/launcher.json" <<EOF
        {
          "name": "ci-e2e",
          "backend_port": 6099,
          "env_file": "$GITHUB_WORKSPACE/.env.ci-e2e.local",
          "backend_pid": $NEW_PID
        }
        EOF
        timeout=60
        elapsed=0
        until curl -fsS http://localhost:6099/api/v1/graph/bootstrap | grep -q '"types"'; do
          if [ "$elapsed" -ge "$timeout" ]; then
            echo "Backend did not come back within ${timeout}s."
            tail -50 backend.log || true
            exit 1
          fi
          sleep 1
          elapsed=$((elapsed+1))
        done
        echo "Backend ready (mock worker)."
      shell: bash

    # The speed budgets are production-build budgets; a dev server is not what
    # users run. `_bundle` keeps the bundle clear of the `/assets` API proxy.
    - name: Build and serve the production UI
      if: ${{ inputs.only == '' || inputs.only == 'navigation' }}
      run: |
        node --max-old-space-size=8192 ./node_modules/vite/bin/vite.js build \
          --mode ci-e2e --outDir "$RUNNER_TEMP/dist-ci-e2e" --emptyOutDir --assetsDir _bundle
        nohup node ./node_modules/vite/bin/vite.js preview --mode ci-e2e \
          --outDir "$RUNNER_TEMP/dist-ci-e2e" --port 5098 --strictPort &> ../preview.log &
        for i in $(seq 1 30); do curl -fsS http://localhost:5098 > /dev/null 2>&1 && break; sleep 1; done
      shell: bash
      working-directory: ui

    - name: Playwright — navigation (every place renders, terminal round trips, speed)
      if: ${{ inputs.only == '' || inputs.only == 'navigation' }}
      env:
        VITE_PORT: '5098'
        FLOWPAD_PERF_GATE: '1'
      # @long specs stay out of the PR run; an explicit grep still reaches them.
      run: npx playwright test --config tests/manual_regression/navigation/playwright.config.ts --max-failures=1 ${{ inputs.grep && format('--grep "{0}"', inputs.grep) || '--grep-invert @long' }}
      shell: bash
      working-directory: ui

    # ---- Artifacts + teardown ----
    - name: Upload Playwright traces
      uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-traces
        path: ui/test-results/**/trace.zip
        retention-days: 30
        if-no-files-found: ignore
        overwrite: true

    - name: Upload server logs
      uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: e2e-server-logs
        path: |
          backend.log
          vite.log
          preview.log
        retention-days: 30
        if-no-files-found: ignore
        overwrite: true

    - name: Stop servers
      if: always()
      run: |
        [ -n "${VITE_PID:-}" ] && kill "$VITE_PID" 2>/dev/null || true
        [ -n "${BACKEND_PID:-}" ] && kill "$BACKEND_PID" 2>/dev/null || true
        pkill -f 'flow_sdk.server.run' 2>/dev/null || true
      shell: bash
