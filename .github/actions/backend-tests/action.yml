name: 'Backend tests (pytest unit + api)'
description: 'uv sync, pip-audit (advisory), pytest tests/unit and tests/api'
runs:
  using: 'composite'
  steps:
    - name: Set up uv + Python 3.10
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.10'
        enable-cache: true

    - name: Install dependencies
      run: uv sync --dev --frozen
      shell: bash

    # Advisory-only: a new CVE in a pinned transitive dep must not block PRs
    # (or, through the deploy gate, PyPI releases). Failures show as a red
    # step icon in the log without failing the job.
    - name: pip-audit (advisory, non-blocking)
      continue-on-error: true
      run: uv tool run pip-audit --desc
      shell: bash

    # Separate steps per tier so a failure is attributable at a glance.
    # pytest.ini enforces --timeout=30 per test; never raise it.
    - name: pytest tests/unit
      run: uv run pytest tests/unit -q
      shell: bash

    # Ignored files spawn or probe a real Claude CLI (absent on CI runners) —
    # verified by running the tier with `claude` hidden from PATH.
    - name: pytest tests/api
      run: >-
        uv run pytest tests/api -q
        --ignore=tests/api/test_agentic_process_actions.py
        --ignore=tests/api/test_agentic_process_resume_after_restart.py
        --ignore=tests/api/test_process_status_lifecycle.py
        --ignore=tests/api/test_pty_process_e2e.py
        --ignore=tests/api/test_pty_stream_endpoint.py
        --ignore=tests/api/test_workflows_run_cli_mode.py
        --ignore=tests/api/test_capability_api.py
        --ignore=tests/api/test_agent_hook.py
      shell: bash
