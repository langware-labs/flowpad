[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = --capture=tee-sys --color=yes --timeout=30
env =
    SQLITE_DATABASE_PATH=/tmp/flowpad_test.db
    TESTING=true
markers =
    manual: marks tests as requiring manual interaction (deselect with '-m "not manual"')
    hub: tests that require a healthy local Flowpad hub
