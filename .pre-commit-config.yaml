repos:
  - repo: local
    hooks:
      # ---------- Python ----------
      - id: ruff
        name: Ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
        exclude: '(claude_skills|claude_test_skills|\.claude/skills)/'
      - id: ruff-format
        name: Ruff Format
        entry: uv run ruff format
        language: system
        types: [python]
        exclude: '(claude_skills|claude_test_skills|\.claude/skills)/'

      # ---------- Frontend (ui/) ----------
      - id: prettier-console
        name: Prettier Console
        entry: scripts/node-hook.sh bash -c 'cd ui && npx prettier --write "${@#ui/}"' --
        language: system
        files: '^ui/'
        types_or: [javascript, ts, tsx, json, css, html]
      - id: eslint-console
        name: ESLint Console
        entry: scripts/node-hook.sh bash -c 'cd ui && npx eslint --fix "${@#ui/}"' --
        language: system
        files: '^ui/'
        types_or: [javascript, ts, tsx, json, css, html]

      # ---------- Electron packaging manifest (electron/) ----------
      # electron-builder.json `files` is a whitelist: a new module under
      # electron/ that is not listed is silently left out of the desktop build
      # and only fails at runtime (`Cannot find module`). Block the commit until
      # every staged electron/ file matches a `files` pattern — positive (ships)
      # or `!` (deliberately not packaged). The JSON is the single source of
      # truth; fix the list, not this hook.
      - id: electron-builder-files
        name: Electron builder files manifest
        # `language: node` (not system): pre-commit provisions node itself
        # (system node when present), so this runs on macOS, Linux and Windows
        # without the bash `node-hook.sh` wrapper. minimatch is pinned to the
        # major electron-builder depends on, so the gate matches exactly what
        # the build will package.
        entry: node scripts/check-electron-builder-files.js
        language: node
        additional_dependencies: ['minimatch@10']
        files: '^electron/'

      # ---------- TypeScript SDK (ts_sdk/) ----------
      # ts_sdk is a top-level SIBLING of ui/ with no TypeScript of its own, so it
      # can't run tsc against its own tsconfig (the @types it references live in
      # ui/node_modules). Instead borrow ui's install: `cd ui && tsc --noEmit`
      # typechecks the SDK through ui's path aliases. (The hub gets this for free
      # because its SDK is nested at flowpad/ui/sdk; ours isn't.)
      - id: tsc-sdk
        name: TypeScript Check SDK
        entry: scripts/node-hook.sh bash -c 'cd ui && npm run type-check:ceiling'
        language: system
        types_or: [ts, tsx]
        files: '^(ts_sdk|ui/src)/'
        pass_filenames: false

      # ---------- i18n catalogs (ui/src/locales) ----------
      # Re-extract Lingui message catalogs whenever a UI source file changes, so
      # a new/moved <Trans>/t`` string can never land with stale src/locales/*.po
      # (the CI "ui i18n guards" job fails on any extract diff). The hook rewrites
      # the .po files; if they changed, pre-commit fails so you re-stage + commit
      # them — same modify-then-fail flow as ruff/prettier/eslint above.
      - id: lingui-extract
        name: Lingui Extract (i18n catalogs)
        entry: scripts/node-hook.sh bash -c 'cd ui && npx lingui extract'
        language: system
        files: '^ui/src/.*\.(t|j)sx?$'
        pass_filenames: false
