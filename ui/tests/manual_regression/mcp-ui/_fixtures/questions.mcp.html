<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Quick Questions</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 24px;
      }
      #mcp-ui-root {
        display: grid;
        gap: 16px;
        max-width: 520px;
        margin: auto;
      }
      label {
        display: block;
        margin: 8px 0;
      }
      textarea,
      input[type='file'] {
        box-sizing: border-box;
        width: 100%;
      }
      textarea {
        min-height: 80px;
      }
      button {
        padding: 10px 16px;
      }
    </style>
  </head>
  <body>
    <main id="mcp-ui-root" data-testid="mcp-ui-root">
      <label>
        Open question
        <textarea data-testid="mcp-ui-open-question"></textarea>
      </label>
      <fieldset>
        <legend>Phases</legend>
        <label>
          <input type="checkbox" value="planning" data-testid="mcp-ui-multiselect-planning" />
          Planning
        </label>
        <label>
          <input type="checkbox" value="design" data-testid="mcp-ui-multiselect-design" />
          Design
        </label>
      </fieldset>
      <input type="file" data-testid="mcp-ui-file-upload" />
      <button type="button" data-testid="mcp-ui-submit">Submit</button>
      <output data-testid="mcp-ui-submission-status"></output>
    </main>
    <script>
      const pending = new Map();
      let nextId = 1;
      window.addEventListener('message', (event) => {
        const message = event.data;
        if (!message || message.jsonrpc !== '2.0' || !pending.has(message.id)) return;
        const waiter = pending.get(message.id);
        pending.delete(message.id);
        if (message.error) waiter.reject(new Error(message.error.message));
        else waiter.resolve(message.result || {});
      });
      const request = (method, params) => {
        const id = nextId++;
        parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
        return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
      };
      const notify = (method, params = {}) => parent.postMessage({ jsonrpc: '2.0', method, params }, '*');

      let file = null;
      const upload = document.querySelector('[data-testid="mcp-ui-file-upload"]');
      upload.addEventListener('change', () => {
        file = upload.files[0] || null;
      });

      document.querySelector('[data-testid="mcp-ui-submit"]').addEventListener('click', async () => {
        const payload = {
          openQuestion: document.querySelector('[data-testid="mcp-ui-open-question"]').value,
          selectedOptions: [...document.querySelectorAll('input[type="checkbox"]:checked')].map((input) => input.value),
          file: file
            ? {
                name: file.name,
                type: file.type,
                size: file.size,
                textPreview: await file.text(),
              }
            : null,
        };
        await request('ui/update-model-context', { content: payload });
        await request('ui/message', {
          role: 'user',
          content: [{ type: 'text', text: `MCP_UI_SUBMISSION ${JSON.stringify(payload)}` }],
        });
        document.querySelector('[data-testid="mcp-ui-submission-status"]').textContent = 'Submitted';
      });

      request('ui/initialize', {
        appInfo: { name: 'flowpad-mcp-ui-form', version: '1.0.0' },
        appCapabilities: {},
        protocolVersion: '2026-01-26',
      }).then(() => notify('ui/notifications/initialized'));
    </script>
  </body>
</html>
