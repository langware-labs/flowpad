<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>And now here</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 90% at 50% -10%, #e2f4ec, #f6f7fb 60%);
    color: #1c2030;
  }
  @media (prefers-color-scheme: dark) {
    body { background: radial-gradient(120% 90% at 50% -10%, #123329, #0d0f18 60%); color: #eef0f8; }
  }
  .card { text-align: center; max-width: 30rem; padding: 2rem; }
  .eyebrow { font-size: .75rem; letter-spacing: .16em; text-transform: uppercase; color: #22a06b; font-weight: 700; }
  h1 { font-size: 2rem; margin: .5rem 0 .75rem; letter-spacing: -.02em; }
  p { color: #4a5069; font-size: 1.05rem; line-height: 1.55; margin: 0 0 2rem; }
  @media (prefers-color-scheme: dark) { p { color: #b3b8cc; } }
  button {
    font: inherit; font-weight: 700; font-size: 1rem; cursor: pointer; color: #fff;
    background: linear-gradient(180deg, #2bb579, #22a06b); border: none;
    border-radius: 14px; padding: .9rem 1.8rem;
    box-shadow: 0 0 0 0 rgba(34,160,107,.55); animation: pulse 1.8s ease-out infinite;
  }
  button:hover { filter: brightness(1.07); }
  button:active { transform: translateY(1px); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(34,160,107,.55); }
    70% { box-shadow: 0 0 0 18px rgba(34,160,107,0); }
    100% { box-shadow: 0 0 0 0 rgba(34,160,107,0); }
  }
  @media (prefers-reduced-motion: reduce) { button { animation: none; } }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Getting started · 2 of 2</div>
    <h1>And now here 🚀</h1>
    <p>Great! Next we'll head to your project home and create your first vibe agent.</p>
    <button id="go" type="button">Let's do it →</button>
  </div>
  <script>
    document.getElementById('go').addEventListener('click', function () {
      parent.postMessage({ source: 'flow-journey', event: 'next', page: 'page2' }, '*');
    });
  </script>
</body>
</html>
