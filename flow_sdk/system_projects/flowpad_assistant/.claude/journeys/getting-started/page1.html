<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Welcome</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 90% at 50% -10%, #ecebff, #f6f7fb 60%);
    color: #1c2030;
  }
  @media (prefers-color-scheme: dark) {
    body { background: radial-gradient(120% 90% at 50% -10%, #242247, #0d0f18 60%); color: #eef0f8; }
  }
  .card { text-align: center; max-width: 30rem; padding: 2rem; }
  .eyebrow { font-size: .75rem; letter-spacing: .16em; text-transform: uppercase; color: #5b5bf0; font-weight: 700; }
  h1 { font-size: 2rem; margin: .5rem 0 .75rem; letter-spacing: -.02em; }
  p { color: #4a5069; font-size: 1.05rem; line-height: 1.55; margin: 0 0 2rem; }
  @media (prefers-color-scheme: dark) { p { color: #b3b8cc; } }
  button {
    font: inherit; font-weight: 700; font-size: 1rem; cursor: pointer; color: #fff;
    background: linear-gradient(180deg, #6d6cff, #5b5bf0); border: none;
    border-radius: 14px; padding: .9rem 1.8rem;
    box-shadow: 0 0 0 0 rgba(91,91,240,.55); animation: pulse 1.8s ease-out infinite;
  }
  button:hover { filter: brightness(1.07); }
  button:active { transform: translateY(1px); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(91,91,240,.55); }
    70% { box-shadow: 0 0 0 18px rgba(91,91,240,0); }
    100% { box-shadow: 0 0 0 0 rgba(91,91,240,0); }
  }
  @media (prefers-reduced-motion: reduce) { button { animation: none; } }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Getting started · 1 of 2</div>
    <h1>Welcome to your journey 👋</h1>
    <p>This is a page that lives inside the journey. Give it a click to continue.</p>
    <button id="go" type="button">Click here →</button>
  </div>
  <script>
    document.getElementById('go').addEventListener('click', function () {
      // Crosses the sandbox boundary; the JourneyController listens for it.
      parent.postMessage({ source: 'flow-journey', event: 'next', page: 'page1' }, '*');
    });
  </script>
</body>
</html>
