<!doctype html>
<!-- mockify fast-mode mock. Copy this folder to <project>/agentic-assets/webapp/mock-<slug>/, fill webapp.json,
     set MOCKIFY.key and MOCKIFY.tree (tree.py compile <row.json>), write one <section data-step> per screen in the
     tree's order, paste assets/mock-tree.js and then assets/journey-bar.js into the last two <script>s. Serve with `flow app serve "Mock — <title>"` so /sdk/ resolves and feedback saves. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock — TITLE</title>
<!-- Flowpad screens: the product's own tokens (served by Flowpad). Another product: its look (colours, font, radius). -->
<link rel="stylesheet" href="/sdk/flowpad.css">
<!-- A phone step (device iphone|android): its screen inside the frame below, at the device width. -->
<link rel="stylesheet" href="device-frame.css">
<script>
  // Flowpad passes ?theme=light|dark and ?view=<mode>; apply both before first paint.
  (function () { var p = new URLSearchParams(location.search), t = p.get('theme');
    if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
    if (p.get('view')) document.documentElement.dataset.view = p.get('view'); })();
</script>
<style>
  body { margin: 0; min-height: 100vh; font-family: var(--font-sans, system-ui, sans-serif); }
  /* Keep the top 56px clear: the journey bar floats there (the reviewer can drag it away). */
  [data-step]:not([data-device]) { min-height: 100vh; padding-top: 56px; box-sizing: border-box; }
  .app-flowpad { background: hsl(var(--background)); color: hsl(var(--foreground)); }
  .app-other   { background: #fff; color: #1f2328; font-family: -apple-system, "Segoe UI", sans-serif; }
  /* An open decision is visible on the screen itself; its id is the mock row's (D1, D2…). */
  [data-decision] { outline: 2px dashed #bf8700; outline-offset: 3px; }
</style>
</head>
<body>

<section data-step="start" class="app-flowpad">
  <!-- The real copy, the real states, what each control does. -->
  <!-- Every control that moves the journey says where it leads; the bar highlights the way onward. -->
  <button data-next="next-step">Continue</button>
  <p data-decision="D1">…</p>
</section>

<section data-step="next-step" data-device="iphone" hidden>
  <div class="mk-device" data-device="iphone" data-camera="island"><div class="mk-screen app-other" style="padding-top:var(--mk-safe-top)">
    <!-- the phone screen, 390x844; keep content clear of --mk-safe-top / --mk-safe-bottom -->
  </div><div class="mk-home"></div></div>
</section>

<script>
  // The mock's row key in the project's `mocks` dataset — the journey, decisions and session come from it.
  window.MOCKIFY = { key: 'SLUG', project: 'MOCK_PROJECT_ID', tree: {/* PASTE the output of: tree.py compile <row.json> */},
                     personas: [/* {id, name, role} — whose screens these are; each step names its persona */] };
</script>
<script>/* PASTE assets/mock-tree.js HERE */</script>
<script>/* PASTE assets/journey-bar.js HERE */</script>
</body>
</html>
