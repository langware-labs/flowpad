<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>forkit</title>
<link rel="stylesheet" href="/sdk/flowpad.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="fk">
  <aside>
    <div class="hd">
      <b id="title">forkit</b>
      <span>root: <code id="root"></code></span>
      <div class="pg"><i id="bar"></i></div>
      <small id="count"></small>
      <div class="flt" id="filter">
        <button data-f="open" class="on">Open</button><button data-f="done">Done</button><button data-f="all">All</button>
      </div>
    </div>
    <ul id="list"></ul>
    <p class="err" id="err" hidden></p>
  </aside>
  <main id="main" class="empty"><div id="hint">Pick an issue to start its fork.</div></main>
</div>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
