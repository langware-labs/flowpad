<section class="layout layout-closing-centered layout--center" data-layout="closing-centered" data-page-type="closing">
  <style>
    .layout-closing-centered { justify-content: center; align-items: center; text-align: center; }
    .layout-closing-centered [data-slot="title"] { font-size: var(--fs-hero); }
    .layout-closing-centered .closing-contact { margin-top: var(--sp-6); color: var(--accent); font-size: var(--fs-body); }
  </style>
  <h1 data-slot="title">Thank you</h1>
  <p class="subtitle" data-slot="subtitle" data-optional>Questions &amp; discussion</p>
  <p class="closing-contact" data-slot="contact" data-optional>hello@example.com</p>
</section>
