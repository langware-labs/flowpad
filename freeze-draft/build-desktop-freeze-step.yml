# Add these steps to the WINDOWS job in flowpad-desktop/.github/workflows/
# build-desktop.yml, AFTER "Install Electron dependencies" and BEFORE
# "Build & sign (Package Windows)" (npm run pack:win). They freeze + sign the
# backend blob and bundle it into the installer that pack:win then signs.
#
# Trigger the build:
#   gh workflow run build-desktop.yml -R langware-labs/flowpad-desktop \
#     -f flowpad_branch=blob-backend-spike
# Then download the SIGNED installer from the run's "windows-builds" artifact
# (an Actions artifact — private to the repo, NOT a release, so users can't get it).

      - name: Setup Python 3.10 (backend freeze)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Freeze + bundle backend blob
        shell: bash
        run: |
          pip install uv
          uv venv .freeze --python 3.10
          # RELEASE_VERSION is resolved earlier in this workflow; use the same version.
          uv pip install --python .freeze "flowpad==${RELEASE_VERSION}" pyinstaller
          .freeze/Scripts/python.exe -m PyInstaller --onedir --noconfirm --clean \
            --name flowpad-backend \
            --collect-all flow_sdk --collect-submodules flow_sdk \
            --copy-metadata flowpad --copy-metadata genai-prices \
            --copy-metadata pydantic-ai-slim --copy-metadata logfire-api \
            --hidden-import aiosqlite --collect-submodules sqlalchemy.dialects.sqlite \
            --distpath electron/resources freeze-draft/freeze_entry.py
          # -> electron/resources/flowpad-backend/flowpad-backend.exe

      - name: Sign flowpad-backend.exe (Azure Trusted Signing)
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if (-not (Get-Module -ListAvailable -Name TrustedSigning)) {
            Install-Module -Name TrustedSigning -Force -Scope CurrentUser -AllowClobber | Out-Null
          }
          Import-Module TrustedSigning
          # Same identity the flow-rs signer uses (electron/signing/metadata.json).
          Invoke-TrustedSigning `
            -Endpoint 'https://eus.codesigning.azure.net/' `
            -CodeSigningAccountName '${{ secrets.SIGNING_ACCOUNT_NAME }}' `
            -CertificateProfileName '${{ secrets.SIGNING_PROFILE_NAME }}' `
            -Files 'electron/resources/flowpad-backend/flowpad-backend.exe' `
            -FileDigest SHA256 -TimestampRfc3161 'http://timestamp.acs.microsoft.com' -TimestampDigest SHA256

      - name: Bundle blob into the installer (extraResources)
        shell: bash
        run: |
          node -e "const f='electron/electron-builder.json',j=require('./'+f);(j.win.extraResources=j.win.extraResources||[]).push({from:'resources/flowpad-backend',to:'flowpad-backend'});require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          echo '--- win.extraResources after patch ---'; node -e "console.log(JSON.stringify(require('./electron/electron-builder.json').win.extraResources,null,2))"
