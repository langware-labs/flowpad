# Add these two steps to the WINDOWS job in flowpad-desktop/.github/workflows/
# build-desktop.yml, AFTER "Install Electron dependencies" and BEFORE
# "Build & sign (Package Windows)" (npm run pack:win).
#
# They freeze the backend into electron/resources/flowpad-backend and add it to
# win.extraResources. The existing afterPack hook (electron/signing/
# sign-flow-rs-win.js) then SIGNS flowpad-backend.exe with the same identity as
# flow-rs.exe, and pack:win bundles + signs the installer. No new secrets.
#
# Trigger:
#   gh workflow run build-desktop.yml -R langware-labs/flowpad-desktop \
#     -f flowpad_branch=blob-backend-spike
# Then download the SIGNED installer from the run's "windows-builds" artifact
# (a private Actions artifact — NOT a release, so users can't get it).

      - name: Setup Python 3.10 (backend freeze)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Freeze + bundle backend blob
        shell: bash
        run: |
          pip install uv
          uv venv .freeze --python 3.10
          # RELEASE_VERSION is resolved earlier in this workflow; freeze that version.
          uv pip install --python .freeze "flowpad==${RELEASE_VERSION}" pyinstaller
          .freeze/Scripts/python.exe -m PyInstaller --onedir --noconfirm --clean \
            --name flowpad-backend \
            --collect-all flow_sdk --collect-submodules flow_sdk \
            --copy-metadata flowpad --copy-metadata genai-prices \
            --copy-metadata pydantic-ai-slim --copy-metadata logfire-api \
            --hidden-import aiosqlite --collect-submodules sqlalchemy.dialects.sqlite \
            --distpath electron/resources freeze-draft/freeze_entry.py
          # -> electron/resources/flowpad-backend/flowpad-backend.exe
          # Add it to win.extraResources so pack:win bundles it (and the afterPack
          # hook signs flowpad-backend.exe).
          node -e "const f='electron/electron-builder.json',j=require('./'+f);(j.win.extraResources=j.win.extraResources||[]).push({from:'resources/flowpad-backend',to:'flowpad-backend'});require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          echo '--- win.extraResources ---'; node -e "console.log(JSON.stringify(require('./electron/electron-builder.json').win.extraResources))"
