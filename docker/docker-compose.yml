# Two flow_sdk backends in fully isolated containers for the realtime
# round-trip tests. The hub stays on the host (already running at
# :8093); both containers reach it via host.docker.internal:8093.
#
# Tests on the host hit:
#   localhost:9008 → alice container → hub (host)
#   localhost:9007 → bob   container → hub (host)
#
# Identity isolation comes from each container having:
#   - its own filesystem (named volume mounted at /root/.flow)
#   - its own python_keyring file backend
#   - its own env namespace (no shell-inheritance path)
#
# Bring up:    docker compose -f docker/docker-compose.yml up -d --build --wait
# Tear down:   docker compose -f docker/docker-compose.yml down -v

# Every backend container shares the same image, host gateway, workspace mount and
# health shape; only ports, env and the data volume differ. Kept as one anchor so a
# change to the mount or the health endpoint cannot land in two of three services.
x-flow-backend: &flow-backend
  image: flowpad-backend:latest
  # Claude Code refuses --dangerously-skip-permissions as root; these containers
  # run as root BY DESIGN (isolated fs). IS_SANDBOX=1 is the CLI's own
  # containers-are-sandboxes escape hatch.
  environment: &flow-backend-env
    IS_SANDBOX: "1"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  # /root/.flow alone is NOT the container's state. The file keyring
  # (/root/.local/share/python_keyring, where a stored LM api key lives) and the
  # vendor CLI's own dir (/root/.claude — transcripts, shell snapshots) sit on the
  # writable layer, so a `--force-recreate` silently threw away a seeded OpenRouter
  # key and every transcript. Each service names its own volumes for these; the
  # Dockerfile comment claiming the keyring is "inside the container's volume" was
  # only true once they were mounted.
  healthcheck: &flow-backend-healthcheck
    interval: 2s
    timeout: 1s
    retries: 20
    start_period: 5s

services:
  alice:
    <<: *flow-backend
    build:
      context: ..
      dockerfile: docker/Dockerfile.flow-backend
    container_name: flowpad_alice
    environment:
      <<: *flow-backend-env
      LOCAL_SERVER_PORT: "9008"
      FLOWPAD_HUB_URL: "http://host.docker.internal:8093"
      FLOWPAD_CLOUD_USER_EMAIL: "alice@local.test"
      FLOWPAD_CLOUD_USER_PASSWORD: "alice-pw-1234"
      FLOWPAD_DEV: "true"
      # Anthropic API key for the claude CLI spawned inside the container.
      # Read from the host's environment; the container fails-soft if unset
      # (claude prints an auth error and exits, which is what the tests then
      # assert against, never a hard "command not found").
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    ports:
      - "9008:9008"
    volumes:
      - alice_flow:/root/.flow
      - alice_keyring:/root/.local/share/python_keyring
      - alice_claude:/root/.claude
      - "${HOME}/Flowpad workspace:/root/Flowpad workspace"
    healthcheck:
      <<: *flow-backend-healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:9008/api/v1/health/status"]

  bob:
    # Reuses the image built by ``alice`` — same Dockerfile, just different env.
    <<: *flow-backend
    container_name: flowpad_bob
    depends_on:
      - alice
    environment:
      <<: *flow-backend-env
      LOCAL_SERVER_PORT: "9007"
      FLOWPAD_HUB_URL: "http://host.docker.internal:8093"
      FLOWPAD_CLOUD_USER_EMAIL: "bob@local.test"
      FLOWPAD_CLOUD_USER_PASSWORD: "bob-pw-1234"
      # FLOWPAD_DEV intentionally unset → instance_name=prod.
      # Critical: this is set per service in this compose file, never via
      # shell-inheritance, so bob can't accidentally pick up alice's FLOWPAD_DEV.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    ports:
      - "9007:9007"
    volumes:
      - bob_flow:/root/.flow
      - bob_keyring:/root/.local/share/python_keyring
      - bob_claude:/root/.claude
      - "${HOME}/Flowpad workspace:/root/Flowpad workspace"
    healthcheck:
      <<: *flow-backend-healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:9007/api/v1/health/status"]

  # vibe: the claude CLI funded by a local LLMEndpoint(kind=api_key,
  # provider=openrouter) instead of a Claude Max device login. The container is what
  # makes that claim checkable — no keychain, no ~/.claude credentials — so a
  # device-funded run cannot succeed and be mistaken for an OpenRouter one.
  # Seed the funding with POST /lm_keys then POST /llm-endpoint/select.
  vibe:
    # Reuses the image built by ``alice`` — same Dockerfile, just different env.
    <<: *flow-backend
    container_name: flowpad_vibe
    depends_on:
      - alice
    environment:
      <<: *flow-backend-env
      LOCAL_SERVER_PORT: "9006"
      FLOWPAD_DEV: "true"
      # DELIBERATELY NO ANTHROPIC_API_KEY: one would let the CLI authenticate on its
      # own, which is the very path this container exists to exclude.
    ports:
      - "9006:9006"
      # Dev-server ports, published so the Vibe Display iframe can load the app:
      # ``get_host`` redirects the browser to ``localhost:<port>``, which is the
      # HOST's localhost. 8000+ is what ``flow app free-dev-port`` hands out; 3000/1
      # is where an agent that ignores it and runs ``npm run dev`` actually lands.
      # Kept narrow — a busy port in a published range fails ``up`` for the file.
      - "8000-8005:8000-8005"
      - "3000-3001:3000-3001"
    volumes:
      - vibe_flow:/root/.flow
      - vibe_keyring:/root/.local/share/python_keyring
      - vibe_claude:/root/.claude
      - "${HOME}/Flowpad workspace:/root/Flowpad workspace"
    healthcheck:
      <<: *flow-backend-healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:9006/api/v1/health/status"]

volumes:
  alice_flow:
  alice_keyring:
  alice_claude:
  bob_flow:
  bob_keyring:
  bob_claude:
  vibe_flow:
  vibe_keyring:
  vibe_claude:
